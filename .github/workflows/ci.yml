name: CI

# Lint → test → build on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test (unit + integration + DOM)
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # Non-secret publishable values; secrets live in repo settings.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: careerpilot-build-${{ github.sha }}
          path: .output
          retention-days: 7

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image (smoke test, not pushed)
        run: docker build -t careerpilot:${{ github.sha }} .
